<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OwnTheMic — AI Interview Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div id="g_id_onload"
     data-client_id="{{ google_client_id }}"
     data-context="signin"
     data-ux_mode="popup"
     data-callback="handleGoogleCredential"
     data-auto_prompt="false">
</div>
<div class="noise"></div>
<div class="orb o1"></div>
<div class="orb o2"></div>
<div class="grid"></div>
<div id="toast"></div>

{% block content %}{% endblock %}
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
